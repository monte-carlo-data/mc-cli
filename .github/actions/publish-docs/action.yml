name: Publish the command reference
description: >-
  Uploads the site tools/gendocs wrote to v2/ on the clidocs bucket, makes v2/ serve its index,
  and invalidates v2/ on the distribution.

inputs:
  site:
    description: Directory holding the site.
    required: true
  role-to-assume:
    description: ARN of the role allowed to write v2/.
    required: true
  bucket:
    description: Bucket the distribution serves.
    required: true
  distribution-id:
    description: CloudFront distribution in front of the bucket.
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: us-east-1
        mask-aws-account-id: true

    # The host serves no directory index, so the object at key v2/ is a copy of the intro. It is
    # written after the sync, whose --delete would remove it.
    - name: Upload the site
      shell: bash
      env:
        SITE: ${{ inputs.site }}
        BUCKET: ${{ inputs.bucket }}
        AWS_MAX_ATTEMPTS: "10"
      run: |
        aws s3 sync "$SITE" "s3://$BUCKET/v2/" --delete --only-show-errors --cache-control max-age=300
        aws s3api put-object --bucket "$BUCKET" --key v2/ --body "$SITE/index.html" \
          --content-type text/html --cache-control max-age=300 > /dev/null

    - name: Invalidate the cache
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ inputs.distribution-id }}
        AWS_MAX_ATTEMPTS: "10"
      run: |
        id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/v2/*' \
          --query Invalidation.Id --output text)
        echo "Invalidation $id created."
