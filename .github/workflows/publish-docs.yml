name: Publish docs

# Builds the command reference on every pull request. A push to dev publishes it to the dev
# clidocs site as a preview. Prod publishes after CI succeeds on main, from the released commit
# with its tag as the version.
#
# The role, bucket and distribution are secrets so the public run logs mask them: repository
# secrets for dev, and the release environment's for prod.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the reference
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go run ./tools/gendocs -o site -version "preview of ${SHA::7}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 7

  # Trusted by the dev role through the branch alone, so it declares no environment.
  publish-dev:
    name: Publish to dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - uses: ./.github/actions/publish-docs
        with:
          site: site
          role-to-assume: ${{ secrets.DOCS_DEV_ROLE_ARN }}
          bucket: ${{ secrets.DOCS_DEV_BUCKET }}
          distribution-id: ${{ secrets.DOCS_DEV_DISTRIBUTION_ID }}

  # The prod role trusts only the release environment. workflow_run's branches filter matches
  # the head branch's name alone, so a fork's branch named main is ruled out here.
  publish-prod:
    name: Publish to prod
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishes only the latest release, so a slow run for an older merge never replaces newer
      # docs. A commit CI released nothing for has no tag.
      - name: Find the release
        id: release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' |
            awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); print $2 }' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$tag" ]; then
            echo "::notice::$SHA has no release tag; nothing to publish."
            exit 0
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$tag" != "$latest" ]; then
            echo "::notice::$tag is not the latest release, $latest; nothing to publish."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.release.outputs.tag != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.release.outputs.tag != ''
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: go run ./tools/gendocs -o site -version "$TAG"

      - uses: ./.github/actions/publish-docs
        if: steps.release.outputs.tag != ''
        with:
          site: site
          role-to-assume: ${{ secrets.DOCS_PROD_ROLE_ARN }}
          bucket: ${{ secrets.DOCS_PROD_BUCKET }}
          distribution-id: ${{ secrets.DOCS_PROD_DISTRIBUTION_ID }}
