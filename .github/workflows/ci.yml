name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the tree. Nothing here publishes, comments or writes.
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The SDK module lives in a private repository, so the runner needs a short-lived token
      # scoped to it. Both steps go away when the SDK is public.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: sdk-token
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-sdk-go
          permission-contents: read

      # GOPRIVATE keeps the module off the public proxy and checksum database. The credential
      # goes in an Authorization header rather than a rewritten remote URL, so it lands in the
      # runner's global git config instead of a repository's.
      - name: Let the build resolve the private SDK module
        shell: bash
        env:
          TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          go env -w GOPRIVATE='github.com/monte-carlo-data/*'
          header="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git config --global http.https://github.com/.extraheader "Authorization: Basic $header"

      - name: Build
        run: go build ./...

      - name: Build the binary
        run: go build -o . ./cmd/montecarlo

      - name: Test
        run: go test ./...

  check:
    name: Vet, format, test and generated-file boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: sdk-token
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-sdk-go
          permission-contents: read

      - name: Let the build resolve the private SDK module
        env:
          TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          go env -w GOPRIVATE='github.com/monte-carlo-data/*'
          header="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git config --global http.https://github.com/.extraheader "Authorization: Basic $header"

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Generated files carry the header and nothing else does
        run: |
          for f in internal/cmd/*_cmd.gen.go; do
            head -1 "$f" | grep -qx '// Code generated by api-codegen; DO NOT EDIT.' \
              || { echo "$f lacks the generated header"; exit 1; }
          done
          for f in internal/cmd/*.go; do
            case "$f" in *_cmd.gen.go) continue ;; esac
            if head -1 "$f" | grep -q 'Code generated'; then
              echo "$f says it is generated but its name is outside the generated pattern"; exit 1
            fi
          done
