name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the tree. Nothing here publishes, comments or writes.
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # The Go version comes from go.mod's `go` directive, so it cannot drift from the module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # github.com/monte-carlo-data/mc-sdk-go is a private repository, so a runner cannot
      # resolve it without a credential. The org's mc-ci-cd-app mints one, scoped to that
      # repository and to `contents: read`, expiring in an hour. Both steps are deletable the
      # day mc-sdk-go becomes public.
      - uses: actions/create-github-app-token@v2
        id: sdk-token
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-sdk-go
          permission-contents: read

      # GOPRIVATE keeps the module off the public proxy and checksum database. The credential
      # goes in an http header rather than the remote URL, so it stays out of .git/config and
      # out of any process's command line.
      - name: Let the build resolve the private SDK module
        shell: bash
        env:
          TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          go env -w GOPRIVATE='github.com/monte-carlo-data/*'
          header="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git config --global http.https://github.com/.extraheader "Authorization: Basic $header"

      - name: Build
        run: go build ./...

      - name: Build the binary
        run: go build -o . ./cmd/montecarlo

  check:
    name: Vet, format, test and generated-file boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/create-github-app-token@v2
        id: sdk-token
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-sdk-go
          permission-contents: read

      - name: Let the build resolve the private SDK module
        env:
          TOKEN: ${{ steps.sdk-token.outputs.token }}
        run: |
          go env -w GOPRIVATE='github.com/monte-carlo-data/*'
          header="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "Authorization: Basic $header"

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      # Regeneration replaces every internal/cmd/*_cmd.gen.go and nothing else. A generated
      # file without the header, or a hand-written file with the suffix, crosses that line.
      - name: Generated files carry the header and nothing else does
        run: |
          for f in internal/cmd/*_cmd.gen.go; do
            head -1 "$f" | grep -qx '// Code generated by api-codegen; DO NOT EDIT.' \
              || { echo "$f lacks the generated header"; exit 1; }
          done
          for f in internal/cmd/*.go; do
            case "$f" in *_cmd.gen.go) continue ;; esac
            if head -1 "$f" | grep -q 'Code generated'; then
              echo "$f says it is generated but its name is outside the generated pattern"; exit 1
            fi
          done
