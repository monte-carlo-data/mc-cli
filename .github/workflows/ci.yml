name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads only, except the three that release a merge to main: tag, release and attest,
# each granted just what it writes.
permissions:
  contents: read

env:
  # The release files that get a provenance attestation. release-snapshot checks each pattern
  # matches, so a typo fails before a merge instead of after the tag.
  RELEASE_SUBJECTS: |
    dist/*.tar.gz
    dist/*.zip
    dist/*_checksums.txt
    dist/install.sh

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build the binary
        run: go build -o . ./cmd/montecarlo

      - name: Test
        run: go test ./...

  check:
    name: Vet, format, test and generated-file boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # gofmt exits 0 whether or not it has anything to report, so the output is the result.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: The release tag is worked out correctly
        run: |
          .github/scripts/next-tag.sh > /dev/null
          .github/scripts/next-tag_test.sh

      - name: Check the third-party notices are current
        run: |
          go generate ./...
          stale="$(git status --porcelain -- THIRD_PARTY_NOTICES)"
          if [ -n "$stale" ]; then
            echo "THIRD_PARTY_NOTICES is out of date. Run go generate ./... and commit the result:"
            echo "$stale"
            exit 1
          fi

      - name: Generated files carry the header and nothing else does
        run: |
          for f in internal/cmd/*_cmd.gen.go; do
            head -1 "$f" | grep -qx '// Code generated by api-codegen; DO NOT EDIT.' \
              || { echo "$f lacks the generated header"; exit 1; }
          done
          for f in internal/cmd/*.go; do
            case "$f" in *_cmd.gen.go) continue ;; esac
            if head -1 "$f" | grep -q 'Code generated'; then
              echo "$f says it is generated but its name is outside the generated pattern"; exit 1
            fi
          done

  release-snapshot:
    name: The release builds for every platform
    # Tags are immutable, so a release that fails after tagging burns that version. A change that
    # breaks cross-compiling or packaging has to fail here, before the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # setup-go's cache key is shared with the build job, whose cache holds only linux/amd64
      # objects, so this job keeps its cross-compiled ones under a key of its own.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-snapshot-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: release-snapshot-${{ runner.os }}-

      # The tag this commit would be released as, so the snapshot is named and stamped exactly as
      # that release. A commit with nothing to release still builds, as v0.0.0.
      - name: Work out the tag
        run: |
          tag=$(.github/scripts/next-tag.sh)
          echo "RELEASE_TAG=${tag:-v0.0.0}" >> "$GITHUB_ENV"

      # Everything a release does except publishing.
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean

      - name: The archives are what the release publishes
        run: |
          version=${RELEASE_TAG#v}
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64 windows_arm64; do
            case $target in
              windows_*) archive=dist/montecarlo_${version}_$target.zip; list="unzip -Z1" ;;
              *) archive=dist/montecarlo_${version}_$target.tar.gz; list="tar tzf" ;;
            esac
            [ -f "$archive" ] || { echo "missing $archive"; exit 1; }
            contents=$($list "$archive" | sort | tr '\n' ' ')
            case $target in windows_*) binary=montecarlo.exe ;; *) binary=montecarlo ;; esac
            want=$(printf '%s\n' LICENSE README.md THIRD_PARTY_NOTICES "$binary" | sort | tr '\n' ' ')
            [ "$contents" = "$want" ] || { echo "$archive holds '$contents', want '$want'"; exit 1; }
            grep -q "  ${archive#dist/}$" "dist/montecarlo_${version}_checksums.txt" \
              || { echo "$archive is not in the checksums file"; exit 1; }
          done
          echo "Six archives, each with the licenses, the README and the binary, all checksummed."

      - name: The binary reports the release's version, commit and date
        run: |
          got=$(dist/montecarlo_linux_amd64_v1/montecarlo version --output json)
          want=$(jq -cn --arg v "$RELEASE_TAG" --arg c "$(git rev-parse HEAD | cut -c1-12)" \
            --arg d "$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" \
            '{commit: $c, date: $d, version: $v}')
          [ "$(printf '%s' "$got" | jq -cS .)" = "$want" ] || { echo "version reports $got, want $want"; exit 1; }
          echo "montecarlo version: $got"

      # The release attaches the installers beside the archives; the snapshot does not publish, so
      # they are copied in to check the patterns against what a release holds.
      - name: Every attestation pattern matches a file
        run: |
          cp install.sh dist/
          while read -r pattern; do
            [ -n "$pattern" ] || continue
            compgen -G "$pattern" > /dev/null || { echo "$pattern matches nothing in dist/"; exit 1; }
          done <<< "$RELEASE_SUBJECTS"

  bot-dependency-diff:
    name: The bot's dependency change stays narrow
    # go.mod and go.sum carry no code owner, so that a generated pull request requests no review.
    # That is only safe while the bot's dependency change is the SDK pin and nothing else, which
    # is what this asserts. The bot is identified by author and by a branch in this repository,
    # not by branch name, which a fork can choose.
    if: >-
      github.event.pull_request.user.login == 'mc-ci-cd-app[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only the mc-sdk-go lines may change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff "origin/$BASE_REF...HEAD" -- go.mod go.sum | grep -E '^[+-][^+-]' || true)
          stray=$(printf '%s\n' "$changed" | grep -v 'monte-carlo-data/mc-sdk-go' | grep -v '^$' || true)
          if [ -n "$stray" ]; then
            echo "This pull request changes dependencies beyond the SDK pin:"
            printf '%s\n' "$stray"
            echo
            echo "These files carry no code owner, so nobody is asked to review them."
            echo "A change beyond the mc-sdk-go lines needs a person to look at it."
            exit 1
          fi
          echo "Only the mc-sdk-go lines changed."

      # A merge to main is a release, so the bot may pin only a released SDK: not a pseudo-version,
      # which can name any commit, and not a replace, which can name another module.
      - name: The SDK pin is a release tag
        run: |
          if grep -E 'monte-carlo-data/mc-sdk-go.*=>' go.mod; then
            echo "go.mod replaces mc-sdk-go. The bot may only pin a release."
            exit 1
          fi
          pin=$(sed -nE 's#^[[:space:]]*(require[[:space:]]+)?github\.com/monte-carlo-data/mc-sdk-go[[:space:]]+([^[:space:]]+).*#\2#p' go.mod)
          if ! printf '%s\n' "$pin" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "go.mod pins mc-sdk-go at '$pin', which is not a release tag vX.Y.Z."
            exit 1
          fi
          echo "mc-sdk-go is pinned at $pin."

  tag:
    name: Tag the release
    needs: [build, check, release-snapshot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One run at a time, so two quick merges cannot pick the same tag. A run still waiting here is
    # replaced by a newer one, whose release then covers both merges.
    concurrency:
      group: tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the tag
        id: next
        run: |
          tag=$(.github/scripts/next-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Tag creation is restricted to the org App and the `apollo` team by a ruleset, and tags are
      # immutable.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: token
        if: steps.next.outputs.tag != ''
        with:
          app-id: ${{ secrets.MC_GITHUB_APP_ID }}
          private-key: ${{ secrets.MC_GITHUB_APP_PRIVATE_KEY }}
          owner: monte-carlo-data
          repositories: mc-cli
          permission-contents: write

      - name: Tag ${{ steps.next.outputs.tag }}
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG."

  # Runs from main's own workflow file, never from the tagged commit's. The `release`
  # environment accepts only main; it holds no secret, and records each release as a deployment.
  release:
    name: Build and publish the release
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # GoReleaser creates the release and uploads its assets with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # No build cache: a release is built from a clean module download, never from a cache that
      # another workflow could have written.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Attests what the release published, downloaded back from it, so a failure here is fixed by
  # rerunning this job alone. gh attestation verify, pinned to this workflow on main, then tells
  # a published release from one built anywhere else.
  attest:
    name: Attest the release's provenance
    needs: [tag, release]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # downloads the release
      id-token: write # signs the attestation through Sigstore
      attestations: write # stores it with the repository
    steps:
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_SUBJECTS }}
